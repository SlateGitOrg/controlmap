# Fixture for `controlmap mock-github` / API-mode tests: the same three repositories as the
# saved REST responses in data/github/, served by an offline mock of the GitHub REST API.
token: mock-token-not-a-secret
repos:
  acme/api:
    default_branch: main
    branches:
      main:
        required_status_checks: {strict: true, contexts: [ci/test, ci/lint]}
        required_pull_request_reviews: {dismiss_stale_reviews: true, require_code_owner_reviews: true, required_approving_review_count: 2}
        enforce_admins: {enabled: true}
        allow_force_pushes: {enabled: false}
        allow_deletions: {enabled: false}
    files:
      .github/CODEOWNERS: "*  @acme/backend\n/.github/  @acme/platform\n"
  acme/web:
    default_branch: main
    branches:
      main:
        required_status_checks: {strict: false, contexts: [build]}
        required_pull_request_reviews: {dismiss_stale_reviews: true, required_approving_review_count: 1}
        enforce_admins: {enabled: false}
        allow_force_pushes: {enabled: false}
        allow_deletions: {enabled: false}
    files:
      CODEOWNERS: "*  @acme/frontend\n/.github/workflows/  @acme/platform\n"
  acme/sandbox:
    default_branch: trunk
    branches:
      trunk: null
